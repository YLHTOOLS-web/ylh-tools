@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Cinzel+Decorative:wght@400;700&family=IM+Fell+English:ital@0;1&display=swap');

:root {
  --void: #080504;
  --ash: #111009;
  --ember: #c8602a;
  --gold: #d4a843;
  --pale: #e8d5a0;
  --iron: #2a1e0f;
  --clay: #5a3a10;
  --smoke: rgba(232,213,160,0.06);
}

*{margin:0;padding:0;box-sizing:border-box;}

html,body{
  background:var(--void);
  color:var(--pale);
  font-family:'IM Fell English',Georgia,serif;
  min-height: 100vh;
  overflow-x:hidden;
}

/* ── STARFIELD ── */
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--d,3s) ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:0.1}50%{opacity:var(--o,0.7)}}

/* ── HEADER ── */
header{
  position:relative;z-index:10;
  text-align:center;
  padding:48px 24px 32px;
  border-bottom:1px solid rgba(212,168,67,0.15);
}
.prog-title{
  font-family:'Cinzel Decorative',serif;
  font-size:clamp(18px,4vw,32px);
  color:var(--gold);
  letter-spacing:4px;
  text-shadow:0 0 40px rgba(212,168,67,0.4);
  animation:glow 4s ease-in-out infinite alternate;
}
@keyframes glow{from{text-shadow:0 0 20px rgba(212,168,67,0.3)}to{text-shadow:0 0 60px rgba(212,168,67,0.6),0 0 100px rgba(200,96,42,0.2)}}
.prog-sub{
  font-family:'IM Fell English',serif;
  font-style:italic;
  font-size:clamp(12px,1.8vw,16px);
  color:var(--pale);
  opacity:0.55;
  margin-top:10px;
  letter-spacing:2px;
}
