<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmological Deep Time</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --ice: #a8d8ea;
    --glacial: #7ec8c8;
    --deep-memory: #2d6a8a;
    --oral: #c17f24;
    --ane: #8b3a3a;
    --hebrew: #4a7c59;
    --exile: #6b4c8a;
    --hellenistic: #8a6a2a;
    --imperial: #7a3a2a;
    --modern: #3a3a3a;
    --bg: #0a0a0f;
    --text: #e8e0d0;
    --panel-bg: #12121a;
    --border-subtle: rgba(232,224,208,0.1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Crimson Pro', serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .header {
    text-align: center;
    padding: 4rem 1rem 1rem;
    position: relative;
  }

  .header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at center top, rgba(168,216,234,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  h1 {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(1.4rem, 5vw, 2.2rem);
    letter-spacing: 0.15em;
    color: var(--ice);
    text-shadow: 0 0 40px rgba(168,216,234,0.3);
    line-height: 1.4;
  }

  .subtitle {
    font-size: clamp(0.85rem, 2.5vw, 1.1rem);
    color: rgba(232,224,208,0.5);
    font-style: italic;
    margin-top: 0.75rem;
    letter-spacing: 0.1em;
  }

  /* ■■ INTERACTIVE ARCHIVE TRIGGER LINK ■■ */
  .trigger-container {
    text-align: center;
    margin: 1.5rem 0;
    position: relative;
    z-index: 10;
  }

  .explainer-btn {
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    background: transparent;
    color: var(--glacial);
    border: 1px dashed rgba(126,200,200,0.4);
    padding: 0.75rem 1.5rem;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .explainer-btn:hover {
    background: rgba(126,200,200,0.05);
    border-color: var(--glacial);
    color: var(--text);
    box-shadow: 0 0 15px rgba(126,200,200,0.15);
  }

  .depth-label {
    text-align: center;
    font-family: 'Cinzel Decorative', serif;
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    color: rgba(232,224,208,0.3);
    margin: 2rem 0;
    text-transform: uppercase;
  }

  .timeline {
    position: relative;
    max-width: 900px;
    margin: 2rem auto;
    padding: 0 1rem 4rem;
  }

  .spine {
    position: absolute;
    left: 50%;
    top: 0;
