<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hebrew Cosmology Galaxy | YLH Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=IM+Fell+English:ital@0;1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #2a2a2a; overflow: hidden; }
  #canvas { display: block; width: 100%; height: 100vh; cursor: grab; }
  #canvas:active { cursor: grabbing; }

  #info-panel {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(26,26,26,0.97); border: 1px solid #c9a227;
    border-radius: 8px; padding: 14px 20px; max-width: 400px; width: 90%;
    display: none; font-family: 'IM Fell English', serif;
    color: #f5f0e8; text-align: center; pointer-events: none;
    box-shadow: 0 0 24px rgba(201,162,39,0.15);
  }
  #info-panel .node-title {
    font-family: 'Cinzel', serif; font-size: 13px; color: #c9a227;
    letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 6px;
  }
  #info-panel .node-desc {
    font-size: 12px; line-height: 1.6; color: #e8e8e8;
  }

  #legend {
    position: fixed; top: 14px; right: 14px;
    font-family: 'Space Mono', monospace; font-size: 9px; color: #999;
    line-height: 2; background: rgba(26,26,26,0.85);
    padding: 10px 14px; border-radius: 6px;
    border: 0.5px solid rgba(201,162,39,0.2);
  }
  #legend span {
    display: inline-block; width: 8px; height: 8px;
    border-radius: 50%; margin-right: 6px; vertical-align: middle;
  }
  #title-block {
    position: fixed; top: 14px; left: 14px;
    font-family: 'Cinzel', serif; color: #c9a227;
    background: rgba(26,26,26,0.85);
    padding: 10px 16px; border-radius: 6px;
    border: 0.5px solid rgba(201,162,39,0.2);
  }
  #title-block h1 { font-size: 13px; letter-spacing: 0.14em; font-weight: 600; }
  #title-block p {
    font-family: 'Space Mono', monospace; font-size: 8px;
    color: #888; margin-top: 3px; letter-spacing: 0.08em;
  }
  #hint {
    position: fixed; bottom: 14px; right: 14px;
    font-family: 'Space Mono', monospace; font-size: 8px; color: #555;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="info-panel">
  <div class="node-title" id="ip-title"></div>
  <div class="node-desc" id="ip-desc"></div>
</div>

<div id="title-block">
  <h1>HEBREW COSMOLOGY GALAXY</h1>
  <p>YLH TOOLS · BRANDY MITCHELL · CC BY 4.0</p>
</div>

<div id="legend">
  <div><span style="background:#c9a227"></span>CORE COSMOLOGY</div>
  <div><span style="background:#7a5abf"></span>TEXTUAL SOURCE</div>
  <div><span style="background:#4a9e8e"></span>THEOLOGICAL BURST</div>
  <div><span style="background:#c0674a"></span>IMPERIAL OVERLAY</div>
  <div><span style="background:#5a8a5a"></span>LIBERATION THREAD</div>
  <div><span style="background:#888888"></span>NEIGHBOR COSMOLOGY</div>
</div>

<div id="hint">DRAG · SCROLL TO ZOOM · HOVER TO READ</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
}
resize();
window.addEventListener('resize', resize);

let pan = { x: 0, y: 0 };
let zoom = 1;
let dragging = false, lastMouse = null;

const COLORS = {
  core: '#c9a227',
  source: '#7a5abf',
  theo: '#4a9e8e',
  imperial: '#c0674a',
  liberation: '#5a8a5a',
  neighbor: '#888888'
};

const nodes = [
  // CENTER
  { id: 'yhwh', label: 'YHWH', sublabel: 'Ehyeh asher ehyeh', x: 0, y: 0, r: 26, color: COLORS.core, glow: true,
    desc: 'The divine name — verb-form, not noun. "I AM WHO I AM" / "I WILL BE WHAT I WILL BE." YHWH as living becoming, not static being. The cosmological center from which all else bursts.' },

  // TIER 1 — Core cosmological
  { id: 'tohu', label: 'Tohu wa-Bohu', sublabel: 'Formless void', x: -180, y: -90, r: 16, color: COLORS.core,
    desc: 'The pre-creation state — formless, void, darkness over the deep (tehom). Not nothingness but potentiality. ANE parallel: Tiamat, primordial waters. Genesis 1 is polemic AGAINST chaos theology, not a neutral description.' },
  { id: 'ruach', label: 'Ruach Elohim', sublabel: 'Wind / Spirit / Breath', x: -60, y: -180, r: 16, color: COLORS.core,
    desc: 'Hovering over the waters. Ruach is breath, wind, spirit — polysemous. The animating force present before light. Not a third person of a Trinity but a divine breath that calls life into being.' },
  { id: 'dabar', label: 'Dabar', sublabel: 'Word / Event / Thing', x: 140, y: -160, r: 16, color: COLORS.core,
    desc: 'YHWH speaks — and it is. Dabar is simultaneously word, event, and thing. The spoken word is the act. Hebrew cosmology: language has ontological weight. Contrast with Greek logos which shifts this toward static essence.' },
  { id: 'shalom', label: 'Shalom', sublabel: 'Wholeness / Right-ordering', x: 180, y: 60, r: 16, color: COLORS.core,
    desc: 'Not merely "peace" — shalom is the right ordering of all relationships: human, ecological, divine. The telos of Hebrew covenantal cosmology. Absence of shalom = injustice, not just conflict.' },
  { id: 'hesed', label: 'Hesed', sublabel: 'Covenant fidelity', x: 160, y: -40, r: 15, color: COLORS.core,
    desc: 'Covenantal loving-kindness. The relational glue of the cosmos. YHWH\'s hesed endures — it is not sentiment but structural commitment. The cosmos runs on hesed, not law alone.' },
  { id: 'tzedek', label: 'Tzedek / Mishpat', sublabel: 'Justice / Right-judgment', x: -160, y: 80, r: 15, color: COLORS.core,
    desc: 'Tzedek = restorative rightness. Mishpat = legal judgment oriented toward the widow, orphan, stranger. Hebrew justice is not abstract but consequence-measured. These are YHWH\'s primary attributes.' },
  { id: 'tehom', label: 'Tehom', sublabel: 'The Deep', x: 40, y: 190, r: 13, color: COLORS.core,
    desc: 'Cognate with Tiamat. The primordial deep waters. In Genesis 1, Elohim does not destroy tehom — divides it. The cosmos is structured out of the deep, not against it. Water = creative-destructive force.' },

  // TIER 2 — Documentary sources
  { id: 'J', label: 'Yahwist (J)', sublabel: '~10th c. BCE · Judah', x: -270, y: -60, r: 13, color: COLORS.source,
    desc: 'The Yahwist source — earthy, anthropomorphic deity who walks in gardens, smells offerings, gets angry. Deeply covenantal. Origin stories from Judahite perspective. Polysemy: YHWH is close, embodied, relational.' },
  { id: 'E', label: 'Elohist (E)', sublabel: '~9th c. BCE · Northern', x: -270, y: 40, r: 13, color: COLORS.source,
    desc: 'Northern kingdom source. Elohim is more distant — speaks in dreams, through angels. Emphasis on fear of God and moral testing. Preserves northern prophetic tradition. Blended with J post-722 BCE.' },
  { id: 'D', label: 'Deuteronomist (D)', sublabel: '~7th c. BCE · Reform', x: -270, y: 140, r: 13, color: COLORS.source,
    desc: 'Josiah reform corpus. Covenant renewal, centralization of worship. YHWH is exclusive — Deuteronomic monotheism. Strong social justice provisions (Deut 15: debt cancellation). Also includes conquest theology.' },
  { id: 'P', label: 'Priestly (P)', sublabel: '~6th c. BCE · Exile', x: -180, y: 200, r: 13, color: COLORS.source,
    desc: 'Exile-era priestly school. Cosmic, ordered, liturgical. Genesis 1 is P\'s creation — structured, measured, Sabbath-oriented. P preserves identity through ritual when temple is gone. Systematizing force.' },

  // TIER 3 — Theological bursts
  { id: 'brit', label: 'Brit / Covenant', sublabel: 'Structural bond', x: 290, y: -120, r: 12, color: COLORS.theo,
    desc: 'Covenant is the governance structure of Hebrew cosmology — not a contract but a binding mutual obligation. Noahic (all creation), Abrahamic (promise), Sinaitic (law), Davidic (kingship). Covenant is YLH\'s analytical core.' },
  { id: 'sabbath', label: 'Shabbat', sublabel: 'Embedded liberation', x: 290, y: -20, r: 12, color: COLORS.theo,
    desc: 'The seventh day is not just rest — it is YHWH\'s governance code built into time. Slaves rest. Debt is cancelled (Sabbath year). Land rests (Jubilee). Shabbat is a weekly anti-empire algorithm.' },
  { id: 'ebyonim', label: 'Ebyonim', sublabel: 'The poor / the bent-down', x: 290, y: 80, r: 12, color: COLORS.theo,
    desc: 'The anawim, the ebyonim — the materially poor are the theological center of Hebrew cosmology. YHWH hears the cry (shavah) of the oppressed. Poverty is not spiritualized — it is a structural condition YHWH addresses.' },
  { id: 'torah', label: 'Torah', sublabel: 'Instruction / Way', x: 80, y: 290, r: 12, color: COLORS.theo,
    desc: 'Not "law" in the Greek-Roman sense but instruction, way, path. Torah is how shalom is maintained. The misreading of Torah as punitive law is a Greek philosophical overlay. Torah\'s goal: flourishing, not compliance.' },
  { id: 'nabi', label: 'Nabi / Prophecy', sublabel: 'Consequence-speaker', x: -80, y: 280, r: 12, color: COLORS.theo,
    desc: 'Prophets (nabi) are consequence-speakers, not future-tellers. They name what is happening now in light of covenantal logic. Amos, Isaiah, Jeremiah — all structural critics of economic injustice.' },
  { id: 'exile', label: 'Golah / Exile', sublabel: 'Crucible of theology', x: -270, y: 220, r: 12, color: COLORS.theo,
    desc: 'Babylonian exile (597–539 BCE) is the theological forge. Loss of land, temple, kingship forced re-articulation of YHWH outside territorial logic. Exile produces the most generative Hebrew theology.' },

  // TIER 4 — Imperial overlays
  { id: 'logos', label: 'Logos', sublabel: 'Greek word-essence swap', x: 120, y: -280, r: 11, color: COLORS.imperial,
    desc: 'John 1 swaps Hebrew dabar for Greek logos — shifting from event/thing to eternal rational principle. This is the Nicene rupture mechanism: YHWH-as-becoming replaced by God-as-static-essence. Hellenization of the covenant.' },
  { id: 'ousia', label: 'Ousia / Substance', sublabel: 'Greek metaphysics', x: 0, y: -290, r: 11, color: COLORS.imperial,
    desc: 'Greek philosophical category — being, substance, essence. Nicene theology imports ousia to define divine nature. Consequence: a God who IS rather than a God who ACTS. Marduk and Baal\'s static cosmic order finds a new vocabulary.' },
  { id: 'empire_rome', label: 'Pax Romana', sublabel: 'Imperial cosmology', x: -120, y: -280, r: 11, color: COLORS.imperial,
    desc: 'Roman imperial theology: Caesar as son of God, peace through military victory. Pax Romana is direct competitor to shalom. Early Christian theology was shaped in contest with this cosmology — and eventually absorbed it.' },
  { id: 'psa', label: 'Penal Sub. Atonement', sublabel: 'Anselm 1098 CE', x: 320, y: 180, r: 11, color: COLORS.imperial,
    desc: 'Anselm\'s satisfaction theory imports feudal honor logic into atonement. God as offended liege lord who demands payment. This is medieval governance architecture mapped onto the cross — not Hebrew covenantal logic.' },
  { id: 'calvinism', label: 'TULIP / Calvinism', sublabel: 'Double predestination', x: 320, y: 280, r: 11, color: COLORS.imperial,
    desc: 'Calvin\'s decretum horribile — some predestined to damnation. Consequence: a God who wills poverty, hierarchy, and election of the powerful. YLH reads this as Stoic fate-logic with Hebrew vocabulary.' },

  // TIER 5 — Liberation threads
  { id: 'jubilee', label: 'Jubilee', sublabel: 'Lev 25 / Year 50', x: -320, y: -140, r: 11, color: COLORS.liberation,
    desc: 'Every 50 years: land returns to original families, debt cancelled, slaves freed. Jubilee is YHWH\'s built-in counter-algorithm against wealth accumulation. Liberation theology\'s economic foundation.' },
  { id: 'exodus', label: "Yetzi'at Mitzrayim", sublabel: 'Exodus event', x: -350, y: -20, r: 13, color: COLORS.liberation,
    desc: 'The Exodus is the founding event of Hebrew theology — not creation. YHWH is first known as liberator. All subsequent covenant logic is read through: "I am YHWH your God who brought you out of Egypt." The theological grammar is liberation.' },
  { id: 'ger', label: 'Ger / Stranger', sublabel: 'Resident alien ethic', x: -340, y: 100, r: 11, color: COLORS.liberation,
    desc: 'The ger (resident alien / stranger) appears 92 times in Torah. "You were strangers in Egypt." Hebrew cosmology hardwires the ethics of the stranger into covenantal memory. Imperial theology erases this.' },
  { id: 'kingjr', label: 'Kingian Ethics', sublabel: 'Beloved Community', x: 0, y: 340, r: 11, color: COLORS.liberation,
    desc: "MLK's Beloved Community as consequence-measure for any theology. King's triple evils — racism, poverty, militarism — are YLH's consequence audit categories. The arc bends toward justice = shalom." },
  { id: 'libtheo', label: 'Liberation Theology', sublabel: 'Gutierrez / Cone / Jennings', x: 170, y: 320, r: 11, color: COLORS.liberation,
    desc: 'Preferential option for the poor is archaeologically recoverable from Hebrew cosmology. Cone\'s Black Theology, Gutiérrez\'s structural analysis, Jennings\'s colonial Christianity — all reading the Hebrew substrate against imperial overlay.' },

  // TIER 6 — Neighbor cosmologies
  { id: 'marduk', label: 'Marduk / Enuma Elish', sublabel: 'Babylonian cosmology', x: -80, y: -310, r: 10, color: COLORS.neighbor,
    desc: 'Babylonian creation epic — Marduk creates humans from the blood of a slain rebel god (Kingu) to serve the gods. Humans as servants of divine hierarchy. Genesis 1 (P source) is direct polemic against this cosmology.' },
  { id: 'baal', label: 'Baal / Canaanite', sublabel: 'Storm-fertility cosmology', x: 80, y: -290, r: 10, color: COLORS.neighbor,
    desc: "Canaanite Baal cycle — storm deity, fertility, death-rebirth. Israel borrowed, contested, and transformed Canaanite cosmology. YHWH absorbs Baal's storm imagery but refuses his fertility-cult economics." },
  { id: 'maat', label: "Ma'at / Egyptian", sublabel: 'Cosmic order / truth', x: -200, y: -220, r: 10, color: COLORS.neighbor,
    desc: "Egyptian ma'at — cosmic truth, order, justice — maintained by Pharaoh's ritual. Similar function to tzedek/mishpat but administered through royal hierarchy, not covenant. The Exodus is a polemic against ma'at." },
  { id: 'aten', label: 'Aten Hypothesis', sublabel: 'Monotheism debate', x: -300, y: -200, r: 9, color: COLORS.neighbor,
    desc: "Akhenaten's solar monotheism (14th c. BCE) — possible influence on Hebrew monotheism debated by scholars. Freud's Moses argument. Most ANE scholars reject direct lineage but acknowledge conceptual resonance." },
];

const edges = [
  ['yhwh','tohu'], ['yhwh','ruach'], ['yhwh','dabar'], ['yhwh','shalom'],
  ['yhwh','hesed'], ['yhwh','tzedek'], ['yhwh','tehom'],
  ['tohu','J'], ['tohu','E'], ['ruach','J'], ['dabar','J'],
  ['shalom','D'], ['tzedek','D'], ['tehom','P'], ['hesed','E'],
  ['P','marduk'], ['P','baal'], ['J','maat'], ['maat','aten'],
  ['hesed','brit'], ['shalom','sabbath'], ['tzedek','ebyonim'],
  ['dabar','torah'], ['tzedek','nabi'], ['tehom','exile'],
  ['D','sabbath'], ['D','torah'], ['E','nabi'], ['P','exile'],
  ['dabar','logos'], ['logos','ousia'], ['ousia','empire_rome'],
  ['empire_rome','psa'], ['psa','calvinism'],
  ['marduk','ousia'], ['baal','logos'],
  ['tzedek','jubilee'], ['yhwh','exodus'], ['exodus','ger'],
  ['exodus','ebyonim'], ['brit','kingjr'], ['nabi','kingjr'],
  ['ebyonim','libtheo'], ['kingjr','libtheo'], ['sabbath','jubilee'],
  ['ger','libtheo'], ['exile','nabi'], ['torah','ger'],
];

function getNode(id) { return nodes.find(n => n.id === id); }

let hoveredNode = null;
let animFrame = 0;

function draw() {
  ctx.clearRect(0, 0, W, H);
  animFrame++;

  ctx.save();
  ctx.translate(W / 2 + pan.x, H / 2 + pan.y);
  ctx.scale(zoom, zoom);

  // Starfield background
  ctx.save();
  const starSeed = 42;
  for (let i = 0; i < 120; i++) {
    const sx = (((i * 137 + starSeed) % 800) - 400);
    const sy = (((i * 97 + starSeed * 2) % 600) - 300);
    const sr = 0.5 + (i % 3) * 0.4;
    const sa = 0.1 + (i % 5) * 0.06 + 0.03 * Math.sin(animFrame * 0.02 + i);
    ctx.beginPath();
    ctx.arc(sx, sy, sr, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(245,240,232,${sa})`;
    ctx.fill();
  }
  ctx.restore();

  // Edges
  edges.forEach(([a, b]) => {
    const na = getNode(a), nb = getNode(b);
    if (!na || !nb) return;
    const isHovered = hoveredNode && (hoveredNode.id === a || hoveredNode.id === b);
    ctx.beginPath();
    ctx.moveTo(na.x, na.y);
    ctx.lineTo(nb.x, nb.y);
    ctx.strokeStyle = isHovered ? 'rgba(201,162,39,0.75)' : 'rgba(245,240,232,0.10)';
    ctx.lineWidth = isHovered ? 1.4 / zoom : 0.7 / zoom;
    ctx.stroke();
  });

  // Nodes
  nodes.forEach(node => {
    const isHovered = hoveredNode && hoveredNode.id === node.id;
    const pulse = node.glow ? 0.7 + 0.3 * Math.sin(animFrame * 0.04) : 0;

    if (node.glow) {
      const grad = ctx.createRadialGradient(node.x, node.y, node.r * 0.5, node.x, node.y, node.r * 3.5);
      grad.addColorStop(0, `rgba(201,162,39,${0.3 + pulse * 0.12})`);
      grad.addColorStop(1, 'rgba(201,162,39,0)');
      ctx.beginPath();
      ctx.arc(node.x, node.y, node.r * 3.5, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
    }

    if (isHovered) {
      const grad = ctx.createRadialGradient(node.x, node.y, node.r, node.x, node.y, node.r * 2.8);
      grad.addColorStop(0, node.color + '55');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.beginPath();
      ctx.arc(node.x, node.y, node.r * 2.8, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(node.x, node.y, isHovered ? node.r + 2 : node.r, 0, Math.PI * 2);
    ctx.fillStyle = node.color + (isHovered ? 'ff' : 'cc');
    ctx.fill();
    ctx.strokeStyle = isHovered ? '#ffffff' : node.color;
    ctx.lineWidth = (isHovered ? 1.5 : 0.8) / zoom;
    ctx.stroke();

    const fontSize = node.r > 20 ? 11 : (node.r > 12 ? 9 : 8);
    ctx.font = `600 ${fontSize}px 'Cinzel', serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = node.r > 20 ? '#1a1a1a' : '#f5f0e8';
    const label = node.label.length > 12 ? node.label.split(' ')[0] : node.label;
    ctx.fillText(label, node.x, node.y - (node.sublabel && node.r >= 13 ? 3 : 0));

    if (node.sublabel && node.r >= 13) {
      ctx.font = `400 7px 'Space Mono', monospace`;
      ctx.fillStyle = node.r > 20 ? 'rgba(26,26,26,0.7)' : 'rgba(245,240,232,0.65)';
      ctx.fillText(node.sublabel.substring(0, 18), node.x, node.y + 7);
    }
  });

  ctx.restore();
  requestAnimationFrame(draw);
}

function getHit(mx, my) {
  const cx = (mx - W / 2 - pan.x) / zoom;
  const cy = (my - H / 2 - pan.y) / zoom;
  return nodes.find(n => Math.hypot(n.x - cx, n.y - cy) < n.r + 8) || null;
}

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const hit = getHit(mx, my);
  hoveredNode = hit;
  const panel = document.getElementById('info-panel');
  if (hit) {
    document.getElementById('ip-title').textContent = hit.label;
    document.getElementById('ip-desc').textContent = hit.desc;
    panel.style.display = 'block';
    canvas.style.cursor = 'pointer';
  } else {
    panel.style.display = 'none';
    canvas.style.cursor = dragging ? 'grabbing' : 'grab';
  }
  if (dragging && lastMouse) {
    pan.x += mx - lastMouse.x;
    pan.y += my - lastMouse.y;
    lastMouse = { x: mx, y: my };
  }
});

canvas.addEventListener('mousedown', e => {
  dragging = true;
  const rect = canvas.getBoundingClientRect();
  lastMouse = { x: e.clientX - rect.left, y: e.clientY - rect.top };
});
canvas.addEventListener('mouseup', () => { dragging = false; lastMouse = null; });
canvas.addEventListener('mouseleave', () => {
  dragging = false; hoveredNode = null;
  document.getElementById('info-panel').style.display = 'none';
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const factor = e.deltaY < 0 ? 1.1 : 0.9;
  const newZoom = Math.max(0.3, Math.min(4, zoom * factor));
  pan.x = (pan.x - (mx - W/2)) * (newZoom / zoom) + (mx - W/2);
  pan.y = (pan.y - (my - H/2)) * (newZoom / zoom) + (my - H/2);
  zoom = newZoom;
}, { passive: false });

let lastTouchDist = null;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    dragging = true;
    lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && dragging) {
    pan.x += e.touches[0].clientX - lastMouse.x;
    pan.y += e.touches[0].clientY - lastMouse.y;
    lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  } else if (e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    if (lastTouchDist) zoom = Math.max(0.3, Math.min(4, zoom * d / lastTouchDist));
    lastTouchDist = d;
  }
}, { passive: false });
canvas.addEventListener('touchend', () => { dragging = false; lastTouchDist = null; });

draw();
</script>
</body>
</html>
